<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DealWithTheCow</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <div class="header">
      <span class="logo">🐮</span>
      <h2>DealWithTheCow</h2>
    </div>

    <div class="card toggle-box">
      <div class="toggle-text">
        <strong id="toggle-state-title">Protection Active</strong>
        <span id="toggle-state-sub">Monitors Reels, Shorts & TikTok</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="placebo-toggle" checked />
        <span class="slider"></span>
      </label>
    </div>

    <div id="placebo-banner" class="placebo-msg hidden">
      Protection disabled.
    </div>

    <div class="card">
      <div class="row">
        <span>Scroll Limit:</span>
        <strong id="threshold-val-text">20</strong>
      </div>
      <div class="slider-row">
        <input type="range" id="threshold-slider" min="1" max="20" value="20" />
        <input type="number" id="threshold-input" min="1" max="20" value="20" />
      </div>
      <small>Spawns the cow after this many scrolls.</small>
    </div>

    <div class="stats-row">
      <div class="card stat">
        <span class="stat-num" id="stat-nuked">0</span>
        <span class="stat-lbl">Tabs Closed</span>
      </div>
      <div class="card stat">
        <span class="stat-num" id="stat-time">0m</span>
        <span class="stat-lbl">Time Saved</span>
      </div>
    </div>

    <div class="footer">
      <button id="btn-reset">Reset Stats</button>
      <span class="ver">v1.1</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
